name: automasters
description: Automobiles parts sales and search

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  #flutter_icons:
  #flutter_remixicon: ^2.5.1
  # google_fonts: ^6.1.0

  rxdart: ^0.27.7

  # HTTP networking package
  dio: ^5.3.3

  # state management
  flutter_bloc: ^8.1.3

  # comparing dart objects
  equatable: ^2.0.5

  # service locator
  get_it: ^7.6.4

  # local database (uses sqlite)
  # floor: ^1.4.2

  # make request to API
  retrofit: ^4.0.3

  # hooks -> for code sharing among widget (manages the lifecycle of widgets)
  # flutter_hooks:

  # cached image
  cached_network_image:

  # capitalize string in sentenceCase
  string_capitalize: ^0.0.10

  # provider: ^6.0.5
  # shared_preferences: ^2.2.2

  collection: ^1.17.2

  # Dropdown autocomplete/filter

  # Local Storage/Database
  hive_flutter: ^1.1.0


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  flutter_typeahead: ^4.8.0
  permission_handler: ^11.0.1
  youtube_player_flutter: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^2.0.0

  retrofit_generator: ^8.0.3
  floor_generator: ^1.4.2
  build_runner: ^2.4.6


# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/

  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
